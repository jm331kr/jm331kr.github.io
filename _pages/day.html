---
layout: archive
title: "Archive"
permalink: /day/
author_profile: true
---

<div id="day-archive" hidden>

  <h1 id="day-title"></h1>

  <div id="day-posts">

    {% for collection in site.collections %}

      {% assign posts = collection.docs | sort: "date" %}

      {% for post in posts %}

        <article
          class="day-entry"
          data-collection="{{ collection.label }}"
          data-date="{{ post.date | date: '%Y-%m-%d' }}"
          data-time="{{ post.date | date: '%s' }}"
          hidden
        >

          <h2 class="day-entry-title">
            {{ post.title }}
          </h2>

          <div class="day-entry-content">
            {{ post.content | markdownify }}
          </div>

        </article>

      {% endfor %}

    {% endfor %}

  </div>

</div>

<p id="day-empty" hidden>
  해당 날짜에 등록된 게시글이 없습니다.
</p>

<style>

/* 숨김 처리 강제 적용 */

#day-archive[hidden],
#day-empty[hidden],
.day-entry[hidden] {
  display: none !important;
}

/* 날짜 제목 */

#day-title {
  font-size: 1.7em;
  font-weight: 700;
  margin-bottom: 30px;
}

/* 게시글 */

.day-entry {
  padding: 0 0 30px;
  margin-bottom: 35px;
  border-bottom: 1px solid #8885;
}

.day-entry:last-child {
  border-bottom: none;
}

/* 게시글 제목 */

.day-entry-title {
  font-size: 1.35em;
  font-weight: 700;
  margin-bottom: 20px;
}

/* 게시글 본문 */

.day-entry-content {
  font-size: 15px;
  line-height: 1.85;
  overflow-wrap: anywhere;
}

.day-entry-content p {
  margin-bottom: 16px;
}

.day-entry-content img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 20px 0;
}

.day-entry-content a {
  overflow-wrap: anywhere;
}

/* 빈 페이지 */

#day-empty {
  text-align: center;
  padding: 30px 0;
  opacity: 0.6;
}

/* 모바일 */

@media (max-width: 600px) {

  #day-title {
    font-size: 1.4em;
  }

  .day-entry {
    padding-bottom: 25px;
    margin-bottom: 30px;
  }

  .day-entry-title {
    font-size: 1.2em;
  }

  .day-entry-content {
    font-size: 14px;
  }

}

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const params = new URLSearchParams(
    window.location.search
  );

  const collection = params.get("collection");
  const date = params.get("date");

  const archive = document.getElementById("day-archive");
  const title = document.getElementById("day-title");
  const empty = document.getElementById("day-empty");
  const container = document.getElementById("day-posts");

  const entries = Array.from(
    container.querySelectorAll(".day-entry")
  );

  // 선택한 카테고리와 날짜의 글만 남기기

  const matched = [];

  entries.forEach(function(entry) {

    const sameCollection =
      entry.dataset.collection === collection;

    const sameDate =
      entry.dataset.date === date;

    if (sameCollection && sameDate) {
      matched.push(entry);
    } else {
      entry.remove();
    }

  });

  // 같은 날짜 내부에서는 시간순으로 정렬

  matched.sort(function(a, b) {
    return Number(a.dataset.time) -
           Number(b.dataset.time);
  });

  matched.forEach(function(entry) {
    entry.hidden = false;
    container.appendChild(entry);
  });

  // 날짜 제목 출력

  if (
    matched.length > 0 &&
    /^\d{4}-\d{2}-\d{2}$/.test(date || "")
  ) {

    const parts = date.split("-");

    title.textContent =
      `${Number(parts[0])}년 ${Number(parts[1])}월 ${Number(parts[2])}일`;

    archive.hidden = false;

  } else {

    archive.hidden = true;
    empty.hidden = false;

  }

});
</script>
