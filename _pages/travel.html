---
layout: archive
title: "Travel"
permalink: /travel/
author_profile: true
---

{% assign sorted_posts = site.travel | sort: "date" | reverse %}

{% for post in sorted_posts %}

  <div style="padding: 22px 0; border-bottom: 1px solid #ddd;">

    <a href="{{ post.url | relative_url }}"
       style="font-size: 20px; font-weight: 500; text-decoration: none;">

      {{ post.date | date: "%Y년 %m월 %d일" }}

    </a>

  </div>

{% endfor %}
