media:
  input: images
  output: /images

content:
  - name: travel
    label: Travel
    type: collection
    path: _travel
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: &post_fields
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss

      - name: body
        label: Content
        type: rich-text

  - name: film
    label: Film
    type: collection
    path: _film
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: books
    label: Books
    type: collection
    path: _books
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: music
    label: Music
    type: collection
    path: _music
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: life
    label: Life
    type: collection
    path: _life
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: study
    label: Study
    type: collection
    path: _study
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: culture
    label: Culture
    type: collection
    path: _culture
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  - name: idea
    label: Ideas
    type: collection
    path: _idea
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields: *post_fields

  
  - name: talks
    label: Talk
    type: collection
    path: _talks
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xxx"

      - name: body
        label: Content
        type: rich-text

