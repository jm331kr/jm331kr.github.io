media:
  input: images
  output: /images

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: date
        label: Date
        type: date
        options:
          time: true
          format: yyyy-MM-dd HH:mm:ss

      - name: categories
        label: Categories
        type: select
        required: true
        options:
          values:
            - name: travel
              label: Travel
            - name: film
              label: Film
            - name: books
              label: Books
            - name: music
              label: Music
            - name: life
              label: Life
            - name: study
              label: Study
            - name: culture
              label: Culture
            - name: ideas
              label: Ideas
            - name: talk
              label: Talk
          multiple: false

      - name: body
        label: Content
        type: rich-text
